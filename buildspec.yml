version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install
  build:
    commands:
      - node --check app.js
      - npm test --if-present

artifacts:
  files:
    - app.js
    - package.json
    - package-lock.json
    - buildspec.yml
    - README.md
